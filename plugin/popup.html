<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Alice Status</title>
    <style>
        body{
            margin:0;
            padding:20px;
            width:220px;
            font-family:Arial, sans-serif;
            background:#111;
            color:#fff;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }

        #status{
            font-size:16px;
            font-weight:bold;
            margin-top:10px;
        }

        .dot{
            width:14px;
            height:14px;
            border-radius:50%;
            margin-bottom:8px;
        }

        .connected{
            background:#00ff66;
            box-shadow:0 0 8px #00ff66;
        }

        .disconnected{
            background:#ff3b3b;
            box-shadow:0 0 8px #ff3b3b;
        }

        .title{
            font-size:14px;
            opacity:0.7;
        }
    </style>
</head>
<body>

    <div class="title">Alice Bridge</div>
    <div id="dot" class="dot disconnected"></div>
    <div id="status">Проверка...</div>

    <script src="popup.js"></script>
</body>
</html>
